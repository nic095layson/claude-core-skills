<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1790" viewBox="0 0 1800 1790">
<defs>
<marker id="ah-pass" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0F436E"/></marker>
<marker id="ah-fail" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker>
</defs>
<rect width="1800" height="1790" fill="#FFFFFF"/>
<text x="60" y="58" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:30px;font-weight:700;fill:#0F436E;">
<tspan x="60" dy="0">OPERATIONAL PROCESS TREE</tspan>
</text>
<text x="60" y="86" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:13px;font-weight:400;fill:#4A4A4A;">
<tspan x="60" dy="0">Gates, checks, and where a failed check sends the work. A standard for AI-assisted work, independent of project, model, or vendor.</tspan>
</text>
<text x="1740" y="58" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:13px;font-weight:600;fill:#1A1A1A;">
<tspan x="1740" dy="0">David Layson</tspan>
</text>
<text x="1740" y="78" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#767676;">
<tspan x="1740" dy="0">Companion to Rules of Engagement for Operational AI v1.0  |  October 12, 2026</tspan>
</text>
<line x1="60" y1="104" x2="1740" y2="104" stroke="#9EB3C5" stroke-width="2"/>
<text x="60" y="140" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:13px;font-weight:700;fill:#0F436E;">
<tspan x="60" dy="0">THE LAWS</tspan>
</text>
<text x="60" y="157" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:400;fill:#767676;">
<tspan x="60" dy="0">bind every step of the sequence (Section 3)</tspan>
</text>
<line x1="60" y1="166" x2="370" y2="166" stroke="#D9D9D9"/>
<text x="660.0" y="140" text-anchor="middle" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:13px;font-weight:700;fill:#0F436E;">
<tspan x="660.0" dy="0">THE ORDER OF OPERATIONS</tspan>
</text>
<text x="660.0" y="157" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:400;fill:#767676;">
<tspan x="660.0" dy="0">one sequence for every non-trivial task (Section 4)</tspan>
</text>
<line x1="430" y1="166" x2="890" y2="166" stroke="#D9D9D9"/>
<text x="1380" y="140" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:13px;font-weight:700;fill:#0F436E;">
<tspan x="1380" dy="0">MECHANICAL CONTROLS</tspan>
</text>
<text x="1380" y="157" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:400;fill:#767676;">
<tspan x="1380" dy="0">they refuse the work; they never merely remind (Section 6)</tspan>
</text>
<line x1="1380" y1="166" x2="1740" y2="166" stroke="#D9D9D9"/>
<rect x="60" y="178" width="310" height="46" fill="#F6F8FA"/>
<text x="68" y="195" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L1</tspan>
</text>
<text x="104" y="195" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Current facts come from current</tspan>
<tspan x="104" dy="15">sources</tspan>
</text>
<text x="68" y="241" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L2</tspan>
</text>
<text x="104" y="241" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Never invent data; every number names</tspan>
<tspan x="104" dy="15">its origin</tspan>
</text>
<rect x="60" y="270" width="310" height="46" fill="#F6F8FA"/>
<text x="68" y="287" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L3</tspan>
</text>
<text x="104" y="287" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Load-bearing facts need two</tspan>
<tspan x="104" dy="15">independent sources</tspan>
</text>
<text x="68" y="333" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L4</tspan>
</text>
<text x="104" y="333" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">“Can’t” needs a receipt; otherwise say</tspan>
<tspan x="104" dy="15">“did not check”</tspan>
</text>
<rect x="60" y="362" width="310" height="46" fill="#F6F8FA"/>
<text x="68" y="379" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L5</tspan>
</text>
<text x="104" y="379" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Totals are built from records, never</tspan>
<tspan x="104" dy="15">from memory</tspan>
</text>
<text x="68" y="425" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L6</tspan>
</text>
<text x="104" y="425" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">No theatrical language, no</tspan>
<tspan x="104" dy="15">uncalibrated confidence</tspan>
</text>
<rect x="60" y="454" width="310" height="46" fill="#F6F8FA"/>
<text x="68" y="471" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L7</tspan>
</text>
<text x="104" y="471" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">No silent defaults; assumptions are</tspan>
<tspan x="104" dy="15">numbered</tspan>
</text>
<text x="68" y="517" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L8</tspan>
</text>
<text x="104" y="517" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Stay inside the fence; flag, don’t fix</tspan>
</text>
<rect x="60" y="531" width="310" height="46" fill="#F6F8FA"/>
<text x="68" y="548" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L9</tspan>
</text>
<text x="104" y="548" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Push back, then commit to one</tspan>
<tspan x="104" dy="15">recommendation</tspan>
</text>
<text x="68" y="594" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="68" dy="0">L10</tspan>
</text>
<text x="104" y="594" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="104" dy="0">Proportionality: no ceremony on trivia</tspan>
</text>
<text x="60" y="656" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:12px;font-weight:700;fill:#0F436E;">
<tspan x="60" dy="0">HOW THE RULES ARE ENFORCED</tspan>
</text>
<line x1="60" y1="664" x2="370" y2="664" stroke="#D9D9D9"/>
<text x="60" y="686" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:600;fill:#1A1A1A;">
<tspan x="60" dy="0">Instructions</tspan>
</text>
<text x="184" y="686" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#4A4A4A;">
<tspan x="184" dy="0">steer when a rule applies</tspan>
</text>
<text x="60" y="706" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:600;fill:#1A1A1A;">
<tspan x="60" dy="0">Skills</tspan>
</text>
<text x="184" y="706" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#4A4A4A;">
<tspan x="184" dy="0">define how; loaded, never</tspan>
<tspan x="184" dy="15">recalled</tspan>
</text>
<text x="60" y="741" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:600;fill:#1A1A1A;">
<tspan x="60" dy="0">Machine checks</tspan>
</text>
<text x="184" y="741" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#4A4A4A;">
<tspan x="184" dy="0">refuse an artifact that fails</tspan>
</text>
<text x="60" y="761" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:600;fill:#1A1A1A;">
<tspan x="60" dy="0">Hooks</tspan>
</text>
<text x="184" y="761" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#4A4A4A;">
<tspan x="184" dy="0">block an unreceipted claim;</tspan>
<tspan x="184" dy="15">force a missed step</tspan>
</text>
<text x="60" y="810" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#0F436E;">
<tspan x="60" dy="0">Enforce the action. Never ask the AI</tspan>
<tspan x="60" dy="15">to certify its own compliance.</tspan>
</text>
<text x="60" y="852" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#0F436E;">
<tspan x="60" dy="0">If a gate refuses: fix the data,</tspan>
<tspan x="60" dy="15">never the gate.</tspan>
</text>
<rect x="570.0" y="179.0" width="180" height="34" rx="17.0" fill="#FFFFFF" stroke="#0F436E" stroke-width="2"/>
<text x="660" y="201" text-anchor="middle" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:14px;font-weight:600;fill:#0F436E;">
<tspan x="660" dy="0">REQUEST</tspan>
</text>
<line x1="660" y1="213" x2="660" y2="235" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<polygon points="660,236.0 780.0,271 660,306.0 540.0,271" fill="#FFFFFF" stroke="#0F436E" stroke-width="2"/>
<text x="660" y="267.5" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:500;fill:#1A1A1A;">
<tspan x="660" dy="0">0  Triage:</tspan>
<tspan x="660" dy="15">trivial, or non-trivial?</tspan>
</text>
<rect x="920" y="245.5" width="420" height="51.0" rx="4" fill="#EEF2F6"/>
<rect x="920" y="245.5" width="5" height="51.0" rx="2" fill="#0F436E"/>
<text x="936" y="264.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="936" dy="0">Trivial: answer directly, no ceremony.</tspan>
<tspan x="936" dy="15.5">Ceremony on trivia trains people to switch governance off (L10).</tspan>
</text>
<line x1="780" y1="271" x2="918" y2="271" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<text x="849.0" y="265" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#0F436E;">
<tspan x="849.0" dy="0">trivial</tspan>
</text>
<text x="672" y="325" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#0F436E;">
<tspan x="672" dy="0">non-trivial</tspan>
</text>
<line x1="660" y1="306" x2="660" y2="338" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<rect x="430" y="340" width="460" height="100" rx="6" fill="#0F436E"/>
<text x="446" y="366" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:15px;font-weight:600;fill:#FFFFFF;">
<tspan x="446" dy="0">1  PLAN GATE</tspan>
</text>
<text x="446" y="388" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">Goal stated so that it could fail  ·  verified facts vs. guesses</tspan>
<tspan x="446" dy="16">Numbered assumptions A1, A2…  ·  success criteria set in advance</tspan>
<tspan x="446" dy="16">Phased plan: an expected result and a fallback for each phase</tspan>
</text>
<line x1="660" y1="440" x2="660" y2="450" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<polygon points="660,451.0 790.0,486 660,521.0 530.0,486" fill="#FFFFFF" stroke="#0F436E" stroke-width="2"/>
<text x="660" y="482.5" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:500;fill:#1A1A1A;">
<tspan x="660" dy="0">Can the goal be failed?</tspan>
<tspan x="660" dy="15">Cheap unknowns converted?</tspan>
</text>
<rect x="920" y="460.5" width="420" height="51.0" rx="4" fill="#EEF2F6"/>
<rect x="920" y="460.5" width="5" height="51.0" rx="2" fill="#4A4A4A"/>
<text x="936" y="479.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="936" dy="0">No: investigate, or ask. Never plan around a question</tspan>
<tspan x="936" dy="15.5">that one lookup could settle.</tspan>
</text>
<line x1="790" y1="486" x2="918" y2="486" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah-fail)"/>
<text x="854.0" y="480" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#4A4A4A;">
<tspan x="854.0" dy="0">no</tspan>
</text>
<path d="M1340,486 L1354,486 L1354,386 L892,386" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah-fail)"/>
<text x="672" y="540" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#0F436E;">
<tspan x="672" dy="0">yes: the plan is shown to the person before any work starts</tspan>
</text>
<line x1="660" y1="521" x2="660" y2="553" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<rect x="430" y="555" width="460" height="100" rx="6" fill="#0F436E"/>
<text x="446" y="581" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:15px;font-weight:600;fill:#FFFFFF;">
<tspan x="446" dy="0">2  PRE-FLIGHT</tspan>
</text>
<text x="446" y="603" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">Every input the work depends on is verified from a dated source</tspan>
<tspan x="446" dy="16">Freshness card: verified  ·  changed since stored  ·  could not verify</tspan>
<tspan x="446" dy="16">(with the attempt named)</tspan>
</text>
<line x1="660" y1="655" x2="660" y2="665" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<polygon points="660,666.0 790.0,701 660,736.0 530.0,701" fill="#FFFFFF" stroke="#0F436E" stroke-width="2"/>
<text x="660" y="697.5" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:500;fill:#1A1A1A;">
<tspan x="660" dy="0">Every input verified</tspan>
<tspan x="660" dy="15">live, this session?</tspan>
</text>
<rect x="920" y="667.75" width="420" height="66.5" rx="4" fill="#EEF2F6"/>
<rect x="920" y="667.75" width="5" height="66.5" rx="2" fill="#4A4A4A"/>
<text x="936" y="686.75" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="936" dy="0">No: verify now, or write “did not check.” A claim of</tspan>
<tspan x="936" dy="15.5">“can’t” names the attempt and how it failed (L4).</tspan>
<tspan x="936" dy="15.5">Capability unavailable: stop and say so. Never from memory.</tspan>
</text>
<line x1="790" y1="701" x2="918" y2="701" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah-fail)"/>
<text x="854.0" y="695" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#4A4A4A;">
<tspan x="854.0" dy="0">no</tspan>
</text>
<text x="672" y="755" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:600;fill:#0F436E;">
<tspan x="672" dy="0">yes</tspan>
</text>
<line x1="660" y1="736" x2="660" y2="768" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<rect x="430" y="770" width="460" height="100" rx="6" fill="#0F436E"/>
<text x="446" y="796" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:15px;font-weight:600;fill:#FFFFFF;">
<tspan x="446" dy="0">3  EXECUTE IN THE FENCE</tspan>
</text>
<text x="446" y="818" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">The work itself, inside the request as written</tspan>
<tspan x="446" dy="16">State handshake before every write (H3)</tspan>
<tspan x="446" dy="16">One authority per decision; divergence named in one clause (H4)</tspan>
</text>
<text x="430" y="886" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="430" dy="0">the three checks on the right run continuously during the work</tspan>
</text>

<tspan x="1126.0" dy="15.5">general.</tspan>

<text x="1126.0" y="855.75" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1126.0" dy="0">Yes: STOP. Re-diagnose before</tspan>
<tspan x="1126.0" dy="15.5">patching. A surprise means the model</tspan>
<tspan x="1126.0" dy="15.5">of the work is wrong somewhere.</tspan>
</text>

<tspan x="1010" dy="0">State matches</tspan>
<tspan x="1010" dy="15">before the write?</tspan>
</text>
<rect x="1110.0" y="902.75" width="230.0" height="66.5" rx="4" fill="#EEF2F6"/>
<rect x="1110.0" y="902.75" width="5" height="66.5" rx="2" fill="#4A4A4A"/>
<text x="1126.0" y="921.75" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1126.0" dy="0">No: nothing is written. The actual</tspan>
<tspan x="1126.0" dy="15.5">state is shown and reconciled, then</tspan>
<tspan x="1126.0" dy="15.5">resend (H3).</tspan>
</text>
<line x1="1092.0" y1="936" x2="1108.0" y2="936" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah-fail)"/>

<text x="446" y="1022" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:15px;font-weight:600;fill:#FFFFFF;">
<tspan x="446" dy="0">4  ADVERSARIAL VERIFICATION</tspan>
</text>
<text x="446" y="1044" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">1  Grade each criterion PASS or FAIL; PARTIAL is FAIL</tspan>
<tspan x="446" dy="16">2  Exercise, don’t inspect      3  Attempt refutation</tspan>
<tspan x="446" dy="16">4  Self-consistency      5  Surprise handling      6  Gap audit</tspan>
<tspan x="446" dy="16">The author is the worst grader of their own work: switch roles.</tspan>
</text>
<line x1="660" y1="1112" x2="660" y2="1125" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>
<polygon points="660,1125.0 815.0,1166 660,1207.0 505.0,1166" fill="#FFFFFF" stroke="#0F436E" stroke-width="2"/>
<text x="660" y="1155.0" text-anchor="middle" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:500;fill:#1A1A1A;">
<tspan x="660" dy="0">All criteria PASS?</tspan>
<tspan x="660" dy="15">No regression? No load-bearing</tspan>
<tspan x="660" dy="15">gap left unattempted?</tspan>
</text>
<rect x="920" y="1125.0" width="420" height="82.0" rx="4" fill="#EEF2F6"/>
<rect x="920" y="1125.0" width="5" height="82.0" rx="2" fill="#4A4A4A"/>
<text x="936" y="1144.0" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="936" dy="0">No: back to the work. A PARTIAL ships nothing.</tspan>
<tspan x="936" dy="15.5">A load-bearing gap that was not attempted is resolved</tspan>
<tspan x="936" dy="15.5">now, or the conclusion it supports is withdrawn.</tspan>
<tspan x="936" dy="15.5">Any regression blocks acceptance, even an “unrelated” one.</tspan>
</text>
<line x1="815" y1="1166" x2="918" y2="1166" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah-fail)"/>

<tspan x="866.5" dy="0">no</tspan>
</text>
<path d="M1340,1166 L1354,1166 L1354,754 L864,754 L864,768" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah-fail)"/>

<tspan x="672" dy="0">yes, with evidence beside every verdict</tspan>
</text>

<text x="446" y="1267" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:15px;font-weight:600;fill:#FFFFFF;">
<tspan x="446" dy="0">5  REPORT</tspan>
</text>
<text x="446" y="1289" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">Method first  ·  every claim dated, marked EVIDENCE or INFERENCE</tspan>
<tspan x="446" dy="16">Bounds stated  ·  next steps left as the owner’s decisions</tspan>
</text>

<rect x="430" y="1353" width="460" height="68" rx="6" fill="#0F436E"/>

<tspan x="446" dy="0">6  LAND IT</tspan>
</text>
<text x="446" y="1401" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">Committed and pushed; the downstream artifact republished (H10)</tspan>
</text>
<line x1="660" y1="1421" x2="660" y2="1435" stroke="#0F436E" stroke-width="2" marker-end="url(#ah-pass)"/>

<tspan x="660" dy="0">Persistence</tspan>
<tspan x="660" dy="15">confirmed?</tspan>
</text>
<rect x="920" y="1443.5" width="420" height="51.0" rx="4" fill="#EEF2F6"/>
<rect x="920" y="1443.5" width="5" height="51.0" rx="2" fill="#4A4A4A"/>
<text x="936" y="1462.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="936" dy="0">No: say so and stop. Work that did not land did not</tspan>
<tspan x="936" dy="15.5">happen; it counts as not done (H10).</tspan>
</text>

<tspan x="849.0" dy="0">no</tspan>

<rect x="430" y="1538" width="460" height="84" rx="6" fill="#0F436E"/>
<text x="446" y="1564" text-anchor="start" style="font-family:Eurostile, 'Poppins SemiBold', Poppins, sans-serif;font-size:15px;font-weight:600;fill:#FFFFFF;">
<tspan x="446" dy="0">7  NAME WHAT FIRED  ·  RECORD LESSONS</tspan>
</text>
<text x="446" y="1586" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12px;font-weight:400;fill:#DCE6F0;">
<tspan x="446" dy="0">Which gates actually ran, stated honestly; a missed gate is named</tspan>
<tspan x="446" dy="16">Failures logged as symptom, root cause, evidence, status</tspan>
</text>

<tspan x="660" dy="0">DELIVERED</tspan>
</text>
<rect x="1380" y="190" width="360" height="84.5" rx="4" fill="#F6F8FA" stroke="#D9D9D9"/>
<rect x="1380" y="190" width="5" height="84.5" fill="#0F436E"/>
<text x="1396" y="210" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Provenance gate</tspan>
</text>
<text x="1730" y="210" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds step 2</tspan>
</text>
<text x="1396" y="230" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Refuses to build when any record asserting a</tspan>
<tspan x="1396" dy="15.5">real-world fact lacks a source and a verification</tspan>
<tspan x="1396" dy="15.5">date.</tspan>
</text>
<rect x="1380" y="282.5" width="360" height="69.0" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/>
<rect x="1380" y="282.5" width="5" height="69.0" fill="#0F436E"/>
<text x="1396" y="302.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Publication gate</tspan>
</text>
<text x="1730" y="302.5" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds step 5</tspan>
</text>
<text x="1396" y="322.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Refuses a report in which a named fact lacks two</tspan>
<tspan x="1396" dy="15.5">sources or a single-source label.</tspan>
</text>
<rect x="1380" y="359.5" width="360" height="69.0" rx="4" fill="#F6F8FA" stroke="#D9D9D9"/>
<rect x="1380" y="359.5" width="5" height="69.0" fill="#0F436E"/>
<text x="1396" y="379.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Receipt gate</tspan>
</text>
<text x="1730" y="379.5" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds steps 2 and 5</tspan>
</text>
<text x="1396" y="399.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Blocks a response that claims inability without</tspan>
<tspan x="1396" dy="15.5">naming the attempt and its failure.</tspan>
</text>
<rect x="1380" y="436.5" width="360" height="69.0" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/>
<rect x="1380" y="436.5" width="5" height="69.0" fill="#0F436E"/>
<text x="1396" y="456.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Verification enforcement</tspan>
</text>
<text x="1730" y="456.5" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds step 4</tspan>
</text>
<text x="1396" y="476.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Blocks a governed task from finishing if the</tspan>
<tspan x="1396" dy="15.5">verification step never loaded.</tspan>
</text>
<rect x="1380" y="513.5" width="360" height="69.0" rx="4" fill="#F6F8FA" stroke="#D9D9D9"/>
<rect x="1380" y="513.5" width="5" height="69.0" fill="#0F436E"/>
<text x="1396" y="533.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Outside-reference check</tspan>
</text>
<text x="1730" y="533.5" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds step 4</tspan>
</text>
<text x="1396" y="553.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Flags a recommendation that repeats across runs</tspan>
<tspan x="1396" dy="15.5">while sitting far from an independent reference.</tspan>
</text>
<rect x="1380" y="590.5" width="360" height="84.5" rx="4" fill="#FFFFFF" stroke="#D9D9D9"/>
<rect x="1380" y="590.5" width="5" height="84.5" fill="#0F436E"/>
<text x="1396" y="610.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Fail-closed build</tspan>
</text>
<text x="1730" y="610.5" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds step 6</tspan>
</text>
<text x="1396" y="630.5" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Refuses to regenerate the published artifact</tspan>
<tspan x="1396" dy="15.5">except through the validated pipeline, verified</tspan>
<tspan x="1396" dy="15.5">the same day.</tspan>
</text>
<rect x="1380" y="683.0" width="360" height="69.0" rx="4" fill="#F6F8FA" stroke="#D9D9D9"/>
<rect x="1380" y="683.0" width="5" height="69.0" fill="#0F436E"/>
<text x="1396" y="703.0" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:12.5px;font-weight:700;fill:#0F436E;">
<tspan x="1396" dy="0">Reproducibility pins</tspan>
</text>
<text x="1730" y="703.0" text-anchor="end" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#767676;font-style:italic;">
<tspan x="1730" dy="0">binds step 6</tspan>
</text>
<text x="1396" y="723.0" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11.5px;font-weight:400;fill:#1A1A1A;">
<tspan x="1396" dy="0">Refuses when a dated analysis cannot be rebuilt</tspan>
<tspan x="1396" dy="15.5">byte-for-byte from the input hashes it names.</tspan>
</text>
<text x="1380" y="774.0" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:10.5px;font-weight:400;fill:#4A4A4A;font-style:italic;">
<tspan x="1380" dy="0">Each control exists because the failure it prevents</tspan>
<tspan x="1380" dy="14">happened once and was then converted into a check. If the</tspan>
<tspan x="1380" dy="14">gate refuses, fix the data, never the gate.</tspan>
</text>
<line x1="60" y1="1704" x2="1740" y2="1704" stroke="#D9D9D9"/>
<rect x="60" y="1718" width="26" height="16" rx="3" fill="#0F436E"/>
<text x="94" y="1731" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:400;fill:#1A1A1A;">
<tspan x="94" dy="0">Step of the sequence</tspan>
</text>
<polygon points="300,1716 314,1726 300,1736 286,1726" fill="#FFFFFF" stroke="#0F436E" stroke-width="2"/>
<text x="322" y="1731" text-anchor="start" style="font-family:Poppins, 'Century Gothic', Futura, Avenir, Helvetica, sans-serif;font-size:11px;font-weight:400;fill:#1A1A1A;">
<tspan x="322" dy="0">Check: the question answered before the work continues</tspan>
</text>
